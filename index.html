<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; connect-src 'self' https://mainnet.base.org https://monk.severin20.workers.dev; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-src 'none'; object-src 'none'; base-uri 'self';">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MONK — the abbey, 1200 AD</title>
<meta name="description" content="Keep the offices. Earn devotion. 56 days in an abbey, 1200 AD.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
<style>
/* ============================================================
   MONK — mobile-first shell on the Club Nile console frame
   (console.png, 832x1248). The frame scales to the viewport WIDTH
   first; every overlay (screen window, d-pad, A/B, power switch,
   panels) is positioned in PERCENTAGES of the frame so it adapts to
   any phone. The game canvas keeps a fixed retro resolution
   (240x240), CSS-scaled.

   The art draws the d-pad and the two buttons, so those are
   invisible hotspots with a press glow. It does NOT draw a power
   switch — that is hand-built below and mounted in the lower band,
   exactly as on the Club Nile console.
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100%;
  background: #0a0a0c;
  overflow: hidden;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  font-family: 'Press Start 2P', monospace;
}
body {
  display: flex; justify-content: center; align-items: center;
  background: radial-gradient(ellipse at 50% 0%, #1b1a24 0%, #0a0a0c 70%);
}
#console {
  position: relative;
  width: min(100vw, calc(100dvh * 832 / 1248));
  aspect-ratio: 832 / 1248;
  container-type: inline-size;
}
#console img.frame {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  z-index: 2; pointer-events: none;
}
/* Screen window: fills the frame's glass cutout (measured at 4.21% / 3.04% /
   91.35% x 60.42%, inset a hair here) so the game takes up the whole pane.
   The bezel rings bury the cutout's feathered edge. */
#screen {
  position: absolute;
  left: 4.33%; top: 3.12%; width: 91.2%; height: 60.65%;
  z-index: 1;
  background: #07070a;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
/* near-black inner band buries the cutout's edge */
#bezel {
  position: absolute; left: 3.37%; top: 2.56%; width: 93.24%; height: 61.77%;
  z-index: 3; pointer-events: none;
  border-style: solid; border-color: #120b06;
  border-width: 0.84cqw 1.08cqw 0.84cqw 0.96cqw;
}
/* thin accent ring right against the game edge */
#bezel-in {
  position: absolute; left: 4.03%; top: 2.92%; width: 91.8%; height: 61.05%;
  z-index: 3; pointer-events: none;
  border: 0.3cqw solid #2c1d10;
}
/* ── boot: the screen is black until the switch is flipped. Then the
   title card drops in, and A steps into the abbey. ── */
#boot {
  position: absolute; left: 4.33%; top: 3.12%; width: 91.2%; height: 60.65%;
  z-index: 5; overflow: hidden; background: #000; opacity: 1;
  transition: opacity 1.7s ease; pointer-events: none;
}
#boot.gone { opacity: 0; }
.boot-card {
  position: absolute; inset: 0;
  transform: translateY(-108%);
  transition: transform 2.4s cubic-bezier(0.25, 0.9, 0.3, 1), opacity 0.4s ease;
}
.boot-card.in { transform: translateY(0%); }
#boot.dark .boot-card { opacity: 0; }
.boot-card canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
#boot-press {
  position: absolute; left: 0; right: 0; top: 78%;
  text-align: center; font-size: 3.2cqw; letter-spacing: 0.4cqw;
  color: #f0e4c4; pointer-events: none; opacity: 0;
}
#boot-press.on { animation: pressBlink 0.9s steps(1) infinite; }
@keyframes pressBlink { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }

/* ── controls: the art already draws the d-pad and the silver A/B
   buttons, so these are invisible hotspots over them, with the same
   press glow Club Nile uses. ── */
.hot { position: absolute; z-index: 3; touch-action: none; }
#dpad  { left: 13%; top: 73%;   width: 29%; height: 21%; }
#btn-b { left: 52%; top: 79%;   width: 18%; height: 13%;   border-radius: 50%; }
#btn-a { left: 67%; top: 72.5%; width: 21%; height: 14.5%; border-radius: 50%; }
.hot.pressed {
  background: radial-gradient(circle, rgba(255,235,170,0.28) 0%, rgba(255,235,170,0) 70%);
}

/* pill buttons riding the glass */
#btn-mute, #btn-menu {
  position: absolute; z-index: 4;
  padding: 0.7cqw 1.6cqw; text-align: center;
  color: #f2d488; font-size: 2.3cqw; letter-spacing: 0.25cqw;
  background: rgba(24,14,4,0.72);
  border: 0.5cqw solid #8a6015;
  border-radius: 2.6cqw; cursor: pointer;
  display: none;
}
#btn-menu { left: 60.2%; top: 4.3%; }
#btn-mute { left: 76%;   top: 4.3%; }
#btn-menu.live, #btn-mute.live { display: block; }
#btn-menu.pressed, #btn-mute.pressed { background: rgba(240,225,180,0.4); color: #2a2118; }
#btn-mute.muted { color: #7d7060; text-decoration: line-through; text-decoration-color: #a33; }

/* ── power switch: a hand-built brass-and-oak slide switch, mounted in the
   lower band where the Club Nile console carries its own. Starts OFF (knob
   left); slide it right to ON to wake the abbey. ── */
#power {
  position: absolute; z-index: 3;
  left: 72%; top: 88.6%; width: 23%; height: 8%;
  touch-action: none; cursor: pointer;
}
#pw-track {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, #7a5330 0%, #4d3220 55%, #3a2414 100%);
  border: 0.5cqw solid #241608;
  border-radius: 2.6cqw;
  box-shadow: inset 0 0.5cqw 0 rgba(210,160,90,0.35),
              inset 0 -0.6cqw 0.8cqw rgba(0,0,0,0.55),
              0 0.5cqw 0.7cqw rgba(0,0,0,0.45);
  overflow: hidden;
}
#pw-track::before {
  content: ''; position: absolute;
  left: 5%; right: 5%; top: 33%; height: 34%;
  background: rgba(16,9,3,0.6); border-radius: 2cqw;
  box-shadow: inset 0 0.3cqw 0.5cqw rgba(0,0,0,0.7);
}
.pw-txt {
  position: absolute; top: 50%; transform: translateY(-50%);
  font-size: 2cqw; letter-spacing: 0.15cqw;
  color: #e6c877; opacity: 0.85; pointer-events: none;
  text-shadow: 0 0.2cqw 0 rgba(0,0,0,0.6);
}
/* the knob exposes the word for the current state: rest LEFT → OFF shows on
   the right; slide RIGHT → ON shows on the left */
.pw-txt.pw-off { right: 8%; }
.pw-txt.pw-on  { left: 8%; }
#power.on .pw-txt.pw-on { color: #b6f0a0; text-shadow: 0 0 1.6cqw rgba(120,220,120,0.8); }
#pw-knob {
  position: absolute; top: 11%; left: 3%; width: 46%; height: 78%;
  border-radius: 2.2cqw;
  background: linear-gradient(180deg, #f8e9b6 0%, #d3aa52 45%, #a97f34 100%);
  border: 0.4cqw solid #5a4014;
  box-shadow: inset 0 0.4cqw 0 rgba(255,248,214,0.75),
              inset 0 -0.5cqw 0.5cqw rgba(90,64,20,0.6),
              0 0.6cqw 0.9cqw rgba(0,0,0,0.55);
  transition: left 0.09s linear;
}
#pw-knob::after {
  content: ''; position: absolute;
  left: 32%; right: 32%; top: 24%; bottom: 24%;
  background: repeating-linear-gradient(90deg,
              rgba(90,64,20,0.65) 0 0.4cqw, transparent 0.4cqw 1.3cqw);
}

/* ── panels. Every overlay lives INSIDE the glass, never over the
   goldwork or the controls — that is what keeps it feeling like a
   handheld. ── */
.panel {
  position: absolute; z-index: 6;
  left: 4.33%; top: 3.12%; width: 91.2%; height: 60.65%;
  display: none; flex-direction: column;
  background: rgba(18,15,12,0.975);
  border: 0.5cqw solid #8a7346;
  border-radius: 0.8cqw;
  color: #f0e8d4; font-size: 2.6cqw;
  box-shadow: 0 0 5cqw rgba(0,0,0,0.6);
}
.panel.open { display: flex; }
.panel-head {
  display: flex; align-items: center; gap: 1.5cqw;
  padding: 1.8cqw 2.2cqw;
  border-bottom: 0.25cqw solid #6b5833;
  color: #e6cf94; letter-spacing: 0.3cqw; font-size: 2.6cqw;
}
.panel-head span { flex: 1; }
.panel-body {
  flex: 1; overflow-y: auto;
  padding: 2.2cqw; line-height: 1.75;
  display: flex; flex-direction: column; gap: 1.8cqw;
}
.panel-body::-webkit-scrollbar { width: 1.2cqw; }
.panel-body::-webkit-scrollbar-thumb { background: #6b5833; border-radius: 1cqw; }
.lead { color: #c3b795; font-size: 2.4cqw; }
.dim  { color: #8a7f68; font-size: 2.2cqw; }
.good { color: #a8d89a; }
.bad  { color: #d89a9a; }
button, .btn {
  font-family: inherit; cursor: pointer;
  background: #3a2f18; color: #edd89a;
  border: 0.28cqw solid #8a7346; border-radius: 0.7cqw;
  padding: 1.3cqw 2.2cqw; font-size: 2.5cqw;
  text-align: center; text-decoration: none; display: block;
}
button:active, .btn:active { background: #55451f; }
button:disabled { opacity: 0.45; cursor: default; }
button.primary { background: #5c3a1c; color: #ffe9b8; }
input {
  font-family: inherit; font-size: 2.5cqw;
  background: #241d14; color: #f4ecd8;
  border: 0.25cqw solid #6b5833; border-radius: 0.7cqw;
  padding: 1.3cqw; width: 100%;
}
label { display: flex; flex-direction: column; gap: 0.9cqw; color: #e6cf94; font-size: 2.3cqw; }
.row { display: flex; gap: 1.4cqw; align-items: stretch; }
.row > * { flex: 1 1 auto; min-width: 0; }
.row > button { flex: 0 0 auto; white-space: nowrap; }
/* highlight for the d-pad's current selection inside a panel */
.gbsel {
  outline: 0.6cqw solid #e6cf94 !important; outline-offset: 0.2cqw;
  box-shadow: 0 0 2.2cqw rgba(230,207,148,0.55) !important;
}
.board { display: flex; flex-direction: column; gap: 0.5cqw; }
.board-row {
  display: flex; justify-content: space-between; gap: 1.2cqw;
  color: #ded2b2; font-size: 2.2cqw;
  padding: 0.8cqw 1.2cqw; background: #241d14; border-radius: 0.5cqw;
}
.board-row.me { background: #3d3218; color: #ffe9b8; }
.board-row b { color: #e6cf94; font-weight: normal; }
.tasklist { display: flex; flex-direction: column; gap: 1cqw; }
.tasklist div { display: flex; justify-content: space-between; }
#kbd-hint {
  position: fixed; bottom: 0.5%; left: 50%; transform: translateX(-50%);
  color: #a8977a; font-size: 8px; letter-spacing: 1px; text-align: center;
  background: rgba(10,10,12,0.75); padding: 6px 10px; border-radius: 6px;
  z-index: 8; display: none;
}
@media (pointer: fine) { #kbd-hint { display: block; } }
</style>
</head>
<body>

<div id="console">
  <canvas id="screen" width="480" height="480"></canvas>
  <img class="frame" src="assets/monk/console.png" alt="Monk console">
  <div id="bezel"></div>
  <div id="bezel-in"></div>
  <div id="boot"><div class="boot-card" id="boot-card"><canvas id="boot-cvs" width="480" height="480"></canvas></div><div id="boot-press">PRESS A</div></div>

  <div id="btn-menu">BOOK</div>
  <div id="btn-mute">SOUND</div>

  <div class="hot" id="dpad"></div>
  <div class="hot" id="btn-b"></div>
  <div class="hot" id="btn-a"></div>

  <div id="power">
    <div id="pw-track">
      <span class="pw-txt pw-on">ON</span>
      <span class="pw-txt pw-off">OFF</span>
      <div id="pw-knob"></div>
    </div>
  </div>

  <!-- THE BOOK: the player's whole account, on tabs driven by the d-pad -->
  <div id="book-panel" class="panel">
    <div class="panel-head"><span id="book-title">THE BOOK</span><button data-close="book-panel" type="button">X</button></div>
    <div class="panel-body" id="book-body"></div>
  </div>
</div>
<div id="kbd-hint">ARROWS / WASD MOVE · E or ENTER = A · ESC = B · TAB = BOOK</div>

<script src="js/config.js"></script>
<script>
'use strict';
/* ==========================================================================
   MONK — an abbey, 1200 AD. Top-down, one room, three offices a day.

   The engine is Club Nile's, stripped to what an abbey needs: a fixed
   240x240 room drawn once into an offscreen canvas, a handful of solid
   rectangles for collision, and characters built from half-pixel cells so
   they hold up at 2x. What is NOT here matters as much — no scrolling
   camera, no multiplayer socket, no per-frame network. The player's whole
   state arrives in one /state call and changes only when they keep an
   office, which is what lets thousands of players share a free backend.
   ========================================================================== */

const CFG = window.MONK_CFG;
/* The screen is 240x240, but the ROOM is only 13 tiles tall. The bottom
   32px is the HUD strip — devotion, the level bar and the offices tally
   live there permanently, so nothing the player needs to see (the rose
   window, the altar, the cross) ever sits behind it. */
const TS = 16, COLS = 15, ROWS = 13, W = 240, H = 240;
const ROOM_H = ROWS * TS;          // 208
const HUD_Y = ROOM_H + 2;          // 210

const cvs = document.getElementById('screen');
const ctx = cvs.getContext('2d');
/* 2x supersampled backing store: the game thinks in 240x240, but every
   asset can carry half-pixel detail. */
ctx.setTransform(2, 0, 0, 2, 0, 0);
ctx.imageSmoothingEnabled = false;

/* flips true when the player powers on and presses A off the title card */
let booted = false, started = false;

/* ---------------------------- palette ----------------------------
   Cold northern stone, oak, tallow-light. Warmth comes only from fire —
   candles, the brazier, the altar — so that lighting candles reads as the
   room getting kinder. */
const C = {
  stoneA:'#9c968a', stoneB:'#8e887c', stoneC:'#7d786d', stoneLine:'#6a655b',
  stoneLit:'#b4ada0', stoneDark:'#5c5850',
  wall:'#8a8478', wallLight:'#a49d90', wallDark:'#645f56', wallLine:'#4e4a43',
  wood:'#6b4a2c', woodLight:'#8a6238', woodDark:'#422c18', woodHi:'#a67c48',
  cloth:'#f4f1e8', clothSh:'#cfcabb', clothHi:'#ffffff',
  skin:'#e8c49a', skinSh:'#c39a70',
  runner:'#7a2230', runnerDark:'#5c1522', runnerLight:'#9c3040', runnerGold:'#d6b268',
  gold:'#e6cf94', goldHi:'#fff2c8', goldDark:'#a8894a',
  flame1:'#ffb347', flame2:'#ffe08a', flame3:'#ff7c34',
  glass1:'#4a7ec0', glass2:'#c0483c', glass3:'#d8b44c', glass4:'#3f9060',
  white:'#f6f2e6', black:'#14120f', dim:'#7a7365',
  green:'#a8d89a', shadow:'rgba(14,10,6,0.30)',
};
const FONT = '8px "Press Start 2P", monospace';

/* deterministic 2D hash — the same one Club Nile dithers with */
function h2(x, y) { return (((x * 73856093) ^ (y * 19349663)) >>> 0) % 97; }

function hex2rgb(h) {
  return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
}
function mixc(a, b, t) {
  const A = hex2rgb(a), B = hex2rgb(b);
  return '#' + A.map((v,i) => Math.round(v + (B[i]-v)*t).toString(16).padStart(2,'0')).join('');
}

/* ============================ sprites ============================
   The player is deliberately the simplest thing on screen: Club Nile's
   blank head with eyes, and a white oval for a body. Everything that
   makes a monk a monk — the hood, the cord, the tonsure — is one or two
   half-pixel marks on top of those two shapes. */

/** chunky pixel ellipse, half-pixel grid */
function ellipse(g, cx, cy, rx, ry, col) {
  g.fillStyle = col;
  for (let y = Math.floor((cy-ry)*2)/2; y <= cy+ry; y += 0.5) {
    for (let x = Math.floor((cx-rx)*2)/2; x <= cx+rx; x += 0.5) {
      const dx = (x+0.25-cx)/rx, dy = (y+0.25-cy)/ry;
      if (dx*dx + dy*dy <= 1) g.fillRect(x, y, 0.5, 0.5);
    }
  }
}
function blk(g, x, y, w, h, col) { if (!col) return; g.fillStyle = col; g.fillRect(x, y, w, h); }

/* Selective outline, lifted from Club Nile: a darkened tint of whatever
   fill it borders, which reads far richer than a flat black key line. */
function outlineHD(c) {
  const w = c.width, h = c.height, g = c.getContext('2d');
  const src = g.getImageData(0, 0, w, h);
  const out = g.createImageData(w, h);
  const A = (x, y) => (x < 0 || y < 0 || x >= w || y >= h) ? 0 : src.data[(y*w+x)*4+3];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y*w+x)*4;
    if (src.data[i+3] > 0) {
      out.data[i] = src.data[i]; out.data[i+1] = src.data[i+1];
      out.data[i+2] = src.data[i+2]; out.data[i+3] = 255;
    } else if (A(x-1,y) || A(x+1,y) || A(x,y-1) || A(x,y+1)) {
      let nr = 0, ng = 0, nb = 0, nc = 0;
      const add = (xx, yy) => {
        if (xx < 0 || yy < 0 || xx >= w || yy >= h) return;
        const j = (yy*w+xx)*4;
        if (src.data[j+3] > 0) { nr += src.data[j]; ng += src.data[j+1]; nb += src.data[j+2]; nc++; }
      };
      add(x-1,y); add(x+1,y); add(x,y-1); add(x,y+1);
      if (nc) { nr /= nc; ng /= nc; nb /= nc; }
      out.data[i]   = Math.round(nr*0.28 + 26*0.72);
      out.data[i+1] = Math.round(ng*0.28 + 22*0.72);
      out.data[i+2] = Math.round(nb*0.28 + 18*0.72);
      out.data[i+3] = 255;
    }
  }
  g.putImageData(out, 0, 0);
}

/**
 * One frame of a monk. Logical space is 20 wide x 28 tall; the canvas is
 * 2x that so half-pixel detail survives.
 *
 * dir  : 'down' | 'up' | 'left' | 'right'
 * step : 0 or 1 — the walk cycle is the robe hem swaying and the feet
 *        alternating, because a robe has no legs to animate.
 * pose : 'stand' | 'kneel'
 */
function monkFrame(t, dir, step, pose) {
  const c = document.createElement('canvas');
  /* 30 logical rows rather than 28: the heads are big, and the extra
     headroom keeps a hood or a tonsure from clipping the top edge. The
     figure still stands on the same baseline — see drawEntity. */
  c.width = 40; c.height = 60; c.lw = 20; c.lh = 30;
  const g = c.getContext('2d');
  g.setTransform(2, 0, 0, 2, 0, 0);
  g.imageSmoothingEnabled = false;
  g.translate(1, 3);

  const kneel = pose === 'kneel';
  const drop = kneel ? 3 : 0;                 // whole figure sinks when kneeling
  const sway = step ? 0.5 : 0;                // hem sway on the walk cycle
  const cx = 9;

  /* ── the body: a white oval. Nothing more. ── */
  const bodyTop = 11 + drop, bodyBot = kneel ? 25 : 25;
  const byc = (bodyTop + bodyBot) / 2, byr = (bodyBot - bodyTop) / 2;
  ellipse(g, cx, byc, kneel ? 6.5 : 5.5, byr, t.robe);
  /* cool shadow down the right, warm light up the left — the whole
     reason a flat oval reads as cloth */
  ellipse(g, cx + 2.5, byc + 0.5, 3.2, byr - 0.5, t.robeSh);
  ellipse(g, cx - 2, byc - 1, 2.4, byr - 2, t.robeHi);
  /* hem: a straight cut across the bottom so it sits on the floor */
  blk(g, cx - 5.5, bodyBot - 0.5, 11, 1, t.robeSh);

  /* cord at the waist — the one piece of colour on a habit. The player has
     none: they are a plain white oval, and every robe detail belongs to the
     abbot so the two read apart at a glance. */
  if (!kneel && t.cord) {
    blk(g, cx - 4.5 + sway, 17, 9, 0.5, t.cord);
    blk(g, cx + 2 + sway, 17.5, 0.5, 2.5, t.cord);
  }

  /* feet, alternating — just enough to sell walking under a robe */
  if (!kneel) {
    const l = step ? 0.5 : 0, r = step ? 0 : 0.5;
    blk(g, cx - 3.5, 25 - l, 2.5, 1, t.sandal);
    blk(g, cx + 1,   25 - r, 2.5, 1, t.sandal);
  }

  /* ── the head: Club Nile's blank head with eyes, at 1.3x ── */
  const hy = 5.5 + drop;
  ellipse(g, cx, hy, 6.5, 7.15, t.skin);
  ellipse(g, cx - 2, hy - 2, 3.4, 3.4, mixc(t.skin, '#fff6e2', 0.35));
  ellipse(g, cx + 3.9, hy + 2, 2.6, 3.9, t.skinSh);

  /* the hood, thrown back on the shoulders or up over the head */
  if (t.hooded) {
    ellipse(g, cx, hy - 0.65, 7.8, 7.8, t.robe);
    ellipse(g, cx + 4.5, hy + 0.65, 3.4, 5.2, t.robeSh);
    /* the hood's mouth: a dark opening that the face sits inside */
    const ho = dir === 'left' ? -1.3 : dir === 'right' ? 1.3 : 0;
    if (dir !== 'up') ellipse(g, cx + ho, hy + 1.3, 4.4, 4.7, '#2c2419');
    ellipse(g, cx + ho, hy + 1.8, 3.9, 3.9, t.skin);
  } else if (t.tonsure) {
    /* Tonsure: a ring of hair around a shaved crown. Clipped to the top of
       the skull and cut with a second, smaller dome — a straight bar across
       the head at this size just reads as a blindfold. */
    g.save();
    g.beginPath();
    g.rect(cx - 8, hy - 8, 16, 5.8);
    g.clip();
    ellipse(g, cx, hy - 1, 6.5, 6.5, t.hair);
    ellipse(g, cx, hy - 1, 4.6, 4.8, mixc(t.skin, '#fff6e2', 0.15));
    g.restore();
  }
  /* otherwise: completely bald. Nothing on the head at all — the player is
     a blank head and a white oval, and that is the whole character. */

  /* eyes — two dots, and that is the entire face. Facing away, none. */
  if (dir !== 'up') {
    const ey = hy + 1.3;
    if (dir === 'down') {
      blk(g, cx - 3.25, ey, 2, 2, t.eye);
      blk(g, cx + 1.25, ey, 2, 2, t.eye);
      blk(g, cx - 3.25, ey, 0.5, 0.5, C.white);
      blk(g, cx + 1.25, ey, 0.5, 0.5, C.white);
    } else {
      /* in profile only the near eye shows */
      const ex = cx + (dir === 'left' ? -3.25 : 1.25);
      blk(g, ex, ey, 2, 2, t.eye);
      blk(g, ex, ey, 0.5, 0.5, C.white);
    }
  }

  g.setTransform(1, 0, 0, 1, 0, 0);
  outlineHD(c);
  return c;
}

/** A monk is four directions x two steps, plus a kneeling frame. */
function makeMonk(traits) {
  /* Defaults ARE the player: a white oval, a bald blank head, no cord and no
     hood. Everything monastic is opt-in, and only the abbot opts in. */
  const t = Object.assign({
    robe: C.cloth, robeSh: C.clothSh, robeHi: C.clothHi,
    skin: C.skin, skinSh: C.skinSh,
    hair: '#6a5844', cord: null, sandal: '#4a3826', eye: '#2a2420',
    hooded: false, tonsure: false,
  }, traits || {});
  const out = { kneel: monkFrame(t, 'down', 0, 'kneel') };
  for (const dir of ['down', 'up', 'left', 'right']) {
    out[dir] = [monkFrame(t, dir, 0, 'stand'), monkFrame(t, dir, 1, 'stand')];
  }
  return out;
}

const SPRITES = {
  player: makeMonk({}),
  /* the abbot: same construction, darker habit, hood up */
  abbot: makeMonk({
    robe: '#4a4238', robeSh: '#332e27', robeHi: '#6b6153',
    hooded: true, cord: '#c8a860', skin: '#dcb488', skinSh: '#b08a60',
  }),
};

/* ============================ the abbey ============================
   One room, fifteen tiles square. Three stations, one for each office,
   set far enough apart that keeping all three is a small walk. */

const WALL_H = 3 * TS;               // north wall: rows 0-2, the rose sits in it

const STATIONS = {
  confess: {
    name: 'THE CONFESSIONAL', verb: 'CONFESS',
    c0: 1, c1: 3, r0: 6, r1: 9,          // west wall
    stand: { x: 4.5 * TS, y: 8 * TS },   // where the player is when facing it
    face: 'left',
  },
  pray: {
    name: 'THE HIGH ALTAR', verb: 'PRAY',
    c0: 6, c1: 8, r0: 3, r1: 3,          // on the dais, under the rose window
    /* a row further back than the other two: kneeling any closer puts the
       player's head over the altar cloth */
    stand: { x: 7.5 * TS, y: 6 * TS },
    face: 'up',
  },
  candles: {
    name: 'THE CANDLE RACK', verb: 'LIGHT CANDLES',
    c0: 11, c1: 13, r0: 6, r1: 9,        // east wall
    stand: { x: 10.5 * TS, y: 8 * TS },
    face: 'right',
  },
};

/* Solid rectangles, in pixels. Collision is a box test against this list —
   ten rectangles are faster to check than a tile lookup and far easier to
   read than a map array. */
const SOLIDS = [
  [0, 0, W, WALL_H],                                     // north wall
  [5.5 * TS, WALL_H, 4 * TS, 20],                        // altar + its dais
  [0, 0, TS, ROOM_H], [W - TS, 0, TS, ROOM_H],           // side walls
  [0, ROOM_H - TS, W, TS],                               // south wall
  [TS, 6 * TS, 3 * TS, 4 * TS],                          // confessional
  [11 * TS, 6 * TS, 3 * TS, 4 * TS],                     // candle rack
  [3 * TS, 5 * TS, TS, TS], [11 * TS, 5 * TS, TS, TS],   // pillars
  [3 * TS, 10 * TS, TS, TS], [11 * TS, 10 * TS, TS, TS],
];

function blocked(px, py) {
  /* the player's feet, not their head — a 8x5 box at the base of the sprite */
  const x0 = px - 4, x1 = px + 4, y0 = py - 2, y1 = py + 3;
  for (const [sx, sy, sw, sh] of SOLIDS) {
    if (x1 > sx && x0 < sx + sw && y1 > sy && y0 < sy + sh) return true;
  }
  return false;
}

/* ── the room, painted once into an offscreen canvas ──
   Nothing in the abbey moves except firelight, so the whole room is one
   drawImage per frame and the flames are painted over it. */
const bg = document.createElement('canvas');
bg.width = W * 2; bg.height = ROOM_H * 2;
(function paintAbbey() {
  const g = bg.getContext('2d');
  g.setTransform(2, 0, 0, 2, 0, 0);
  g.imageSmoothingEnabled = false;

  /* ── flagstone floor: irregular slabs, not a checkerboard ── */
  g.fillStyle = C.stoneB; g.fillRect(0, 0, W, ROOM_H);
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const k = h2(c, r);
      g.fillStyle = k % 5 === 0 ? C.stoneA : k % 7 === 0 ? C.stoneC : C.stoneB;
      g.fillRect(c*TS, r*TS, TS, TS);
      /* mortar joins, lit on top and shadowed at the base */
      g.fillStyle = 'rgba(255,250,235,0.16)'; g.fillRect(c*TS, r*TS, TS, 0.5);
      g.fillStyle = C.stoneLine; g.fillRect(c*TS, r*TS + TS - 0.5, TS, 0.5);
      g.fillStyle = C.stoneLine; g.fillRect(c*TS + TS - 0.5, r*TS, 0.5, TS);
      /* wear and grit */
      for (let i = 0; i < 6; i++) {
        const hx = h2(c*11 + i, r*7);
        g.fillStyle = hx % 2 ? 'rgba(255,250,235,0.14)' : 'rgba(60,55,45,0.16)';
        g.fillRect(c*TS + hx % TS, r*TS + h2(r*11 + i, c*7) % TS, 0.5, 0.5);
      }
    }
  }

  /* ── the red runner, door to altar ── */
  const rx = 6*TS + 4, rw = 3*TS - 8, ry = 4*TS, rh = 8*TS;
  for (let y = 0; y < rh; y++) {
    g.fillStyle = y < 2 ? C.runnerLight : y > rh - 3 ? C.runnerDark : C.runner;
    g.fillRect(rx, ry + y, rw, 1);
  }
  for (let y = 2; y < rh - 2; y += 2) for (let x = (y % 4) ? 2 : 4; x < rw - 2; x += 4) {
    g.fillStyle = h2(x, y) % 2 ? C.runnerDark : C.runnerLight;
    g.fillRect(rx + x, ry + y, 0.5, 1);
  }
  g.fillStyle = C.runnerGold;                                  // gold borders
  g.fillRect(rx + 1, ry, 0.5, rh); g.fillRect(rx + rw - 1.5, ry, 0.5, rh);
  for (let y = ry + 6; y < ry + rh; y += 12) {                  // lozenges
    g.fillStyle = C.runnerGold;
    g.fillRect(rx + rw/2 - 1, y, 2, 0.5); g.fillRect(rx + rw/2 - 1.5, y + 0.5, 3, 0.5);
    g.fillRect(rx + rw/2 - 1, y + 1, 2, 0.5);
  }

  /* ── north wall: ashlar courses ── */
  const wallH = WALL_H;
  for (let y = 0; y < wallH; y += 6) {
    for (let x = (y / 6) % 2 ? -8 : 0; x < W; x += 16) {
      g.fillStyle = h2(x, y) % 4 === 0 ? C.wallLight : C.wall;
      g.fillRect(x, y, 16, 6);
      g.fillStyle = C.wallLine;
      g.fillRect(x, y + 5.5, 16, 0.5); g.fillRect(x + 15.5, y, 0.5, 6);
    }
  }
  g.fillStyle = C.wallDark; g.fillRect(0, wallH - 2, W, 2);      // base shadow
  g.fillStyle = 'rgba(255,250,235,0.2)'; g.fillRect(0, 0, W, 1);

  /* side walls */
  for (const sx of [0, W - TS]) {
    for (let y = 0; y < ROOM_H; y += 6) {
      g.fillStyle = h2(sx, y) % 4 === 0 ? C.wallLight : C.wall;
      g.fillRect(sx, y, TS, 6);
      g.fillStyle = C.wallLine; g.fillRect(sx, y + 5.5, TS, 0.5);
    }
    g.fillStyle = 'rgba(20,16,10,0.30)';
    g.fillRect(sx === 0 ? TS : W - TS - 3, 0, 3, ROOM_H);        // cast shadow
  }

  /* ── rose window over the altar: the room's one piece of colour ── */
  (function rose() {
    const cx = 7.5*TS, cy = 21, R = 14;
    g.fillStyle = '#3a352d';
    ellipse(g, cx, cy, R + 1.5, R + 1.5, '#3a352d');
    ellipse(g, cx, cy, R, R, '#20304a');
    const petals = [C.glass1, C.glass2, C.glass3, C.glass4];
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      ellipse(g, cx + Math.cos(a)*7.5, cy + Math.sin(a)*7.5, 4, 4, petals[i % 4]);
    }
    ellipse(g, cx, cy, 4, 4, C.goldHi);
    /* leading */
    g.fillStyle = '#2a2620';
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      for (let d = 4; d < R; d += 0.5) g.fillRect(cx + Math.cos(a)*d, cy + Math.sin(a)*d, 0.5, 0.5);
    }
    /* light thrown down onto the dais */
    const lg = g.createLinearGradient(0, cy + R, 0, cy + R + 26);
    lg.addColorStop(0, 'rgba(255,232,180,0.30)');
    lg.addColorStop(1, 'rgba(255,232,180,0)');
    g.fillStyle = lg; g.fillRect(cx - 14, cy + R, 28, 26);
  })();

  /* lancet windows either side of the rose */
  for (const wx of [3.2*TS, 11.2*TS]) {
    g.fillStyle = '#3a352d'; g.fillRect(wx - 1, 8, 10, 30);
    g.fillStyle = '#20304a'; g.fillRect(wx, 9, 8, 28);
    ellipse(g, wx + 4, 13, 4, 5, '#20304a');
    g.fillStyle = C.glass1; g.fillRect(wx + 1, 14, 6, 10);
    g.fillStyle = C.glass3; g.fillRect(wx + 1, 24, 6, 6);
    g.fillStyle = C.glass4; g.fillRect(wx + 1, 30, 6, 6);
    g.fillStyle = '#2a2620'; g.fillRect(wx + 3.5, 9, 1, 28);
    const lg = g.createLinearGradient(0, 38, 0, 60);
    lg.addColorStop(0, 'rgba(190,215,255,0.22)'); lg.addColorStop(1, 'rgba(190,215,255,0)');
    g.fillStyle = lg; g.fillRect(wx - 3, 38, 14, 22);
  }

  /* ── the high altar, on its dais ── */
  (function altar() {
    const ax = 6*TS, ay = WALL_H - 4, aw = 3*TS, ah = 24;
    g.fillStyle = C.stoneDark; g.fillRect(ax - 6, ay + ah - 6, aw + 12, 8);   // dais step
    g.fillStyle = C.stoneLit;  g.fillRect(ax - 6, ay + ah - 6, aw + 12, 1.5);
    g.fillStyle = C.stoneA;    g.fillRect(ax, ay, aw, ah - 4);                // mensa
    g.fillStyle = C.stoneLit;  g.fillRect(ax, ay, aw, 2);
    g.fillStyle = C.stoneC;    g.fillRect(ax, ay + ah - 6, aw, 2);
    /* white altar cloth with a gold hem */
    g.fillStyle = C.cloth;     g.fillRect(ax + 2, ay + 3, aw - 4, 9);
    g.fillStyle = C.clothSh;   g.fillRect(ax + 2, ay + 11, aw - 4, 1);
    g.fillStyle = C.goldDark;  g.fillRect(ax + 2, ay + 12, aw - 4, 1);
    for (let x = ax + 5; x < ax + aw - 4; x += 6) {
      g.fillStyle = C.gold; g.fillRect(x, ay + 5, 2, 2); g.fillRect(x + 0.5, ay + 4.5, 1, 3);
    }
    /* the cross */
    const cxx = ax + aw/2;
    g.fillStyle = C.goldDark; g.fillRect(cxx - 1, ay - 12, 2, 14);
    g.fillRect(cxx - 4.5, ay - 8, 9, 2);
    g.fillStyle = C.gold;     g.fillRect(cxx - 0.5, ay - 12, 1, 14);
    g.fillRect(cxx - 4.5, ay - 8, 9, 1);
    g.fillStyle = C.goldHi;   g.fillRect(cxx - 0.5, ay - 11.5, 1, 3);
  })();

  /* ── the confessional: an oak booth against the west wall ── */
  (function confessional() {
    const s = STATIONS.confess;
    const x = s.c0*TS, y = s.r0*TS, w = (s.c1-s.c0+1)*TS, h = (s.r1-s.r0+1)*TS;
    g.fillStyle = C.woodDark; g.fillRect(x, y, w, h);
    g.fillStyle = C.wood;     g.fillRect(x + 1, y + 1, w - 2, h - 2);
    for (let yy = y + 2; yy < y + h - 2; yy += 5) {                 // plank lines
      g.fillStyle = C.woodDark; g.fillRect(x + 2, yy, w - 4, 0.5);
    }
    g.fillStyle = C.woodHi;   g.fillRect(x + 1, y + 1, w - 2, 1);   // top light
    /* the opening, facing east into the room, with its lattice screen */
    const ox = x + w - 5, oy = y + 8, oh = h - 18;
    g.fillStyle = '#171310'; g.fillRect(ox, oy, 5, oh);
    g.fillStyle = C.woodLight;
    for (let yy = oy; yy < oy + oh; yy += 3) g.fillRect(ox, yy, 5, 0.5);
    for (let xx = ox; xx < ox + 5; xx += 2) g.fillRect(xx, oy, 0.5, oh);
    /* a small gable and a cross on top */
    g.fillStyle = C.woodDark;
    for (let i = 0; i < 6; i++) g.fillRect(x + i, y - i/2, w - i*2, 1);
    g.fillStyle = C.goldDark;
    g.fillRect(x + w/2 - 0.5, y - 7, 1, 6); g.fillRect(x + w/2 - 2.5, y - 5, 5, 1);
    /* a curtain, half-drawn */
    g.fillStyle = C.runnerDark; g.fillRect(x + 2, y + 6, 6, oh + 4);
    g.fillStyle = C.runner;     g.fillRect(x + 2, y + 6, 4, oh + 4);
  })();

  /* ── the candle rack: iron tiers against the east wall ── */
  (function rack() {
    const s = STATIONS.candles;
    const x = s.c0*TS, y = s.r0*TS + 4, w = (s.c1-s.c0+1)*TS, h = (s.r1-s.r0+1)*TS - 8;
    g.fillStyle = '#2e2b26'; g.fillRect(x + 2, y + h - 3, w - 4, 3);     // foot
    g.fillStyle = '#3d3934'; g.fillRect(x + 3, y, 2, h);                 // uprights
    g.fillStyle = '#3d3934'; g.fillRect(x + w - 6, y, 2, h);
    for (let i = 0; i < 3; i++) {                                        // tiers
      const ty = y + 6 + i * 14;
      g.fillStyle = '#4a453e'; g.fillRect(x + 2, ty, w - 4, 2);
      g.fillStyle = '#5d574e'; g.fillRect(x + 2, ty, w - 4, 0.5);
      for (let k = 0; k < 4; k++) {                                      // spikes
        g.fillStyle = '#39352f'; g.fillRect(x + 5 + k*8, ty - 2, 1, 2);
      }
    }
    /* a prayer bench in front */
    g.fillStyle = C.woodDark; g.fillRect(x - 4, y + h - 8, 4, 8);
  })();

  /* ── pillars: four, marking the crossing ── */
  for (const [pc, pr] of [[3,5],[11,5],[3,10],[11,10]]) {
    const x = pc*TS, y = pr*TS;
    g.fillStyle = C.stoneDark; g.fillRect(x, y, TS, TS);
    g.fillStyle = C.stoneA;    g.fillRect(x + 1, y, TS - 3, TS);
    g.fillStyle = C.stoneLit;  g.fillRect(x + 1, y, 3, TS);
    g.fillStyle = C.stoneC;    g.fillRect(x + TS - 4, y, 2, TS);
    g.fillStyle = C.stoneLit;  g.fillRect(x - 1, y - 3, TS + 2, 4);      // capital
    g.fillStyle = C.stoneDark; g.fillRect(x - 1, y + 1, TS + 2, 1);
    g.fillStyle = 'rgba(20,16,10,0.28)'; g.fillRect(x + 2, y + TS, TS, 4);
  }

  /* ── the south wall and its door: where a new brother walks in ── */
  (function door() {
    for (let y = ROOM_H - TS; y < ROOM_H; y += 6) {
      for (let x = ((y / 6) | 0) % 2 ? -8 : 0; x < W; x += 16) {
        g.fillStyle = h2(x, y) % 4 === 0 ? C.wallLight : C.wall;
        g.fillRect(x, y, 16, 6);
        g.fillStyle = C.wallLine;
        g.fillRect(x, y + 5.5, 16, 0.5); g.fillRect(x + 15.5, y, 0.5, 6);
      }
    }
    g.fillStyle = 'rgba(255,250,235,0.18)'; g.fillRect(0, ROOM_H - TS, W, 1);
    const dx = 6*TS + 2, dw = 3*TS - 4, dy = ROOM_H - TS;
    g.fillStyle = C.woodDark; g.fillRect(dx, dy, dw, TS);
    g.fillStyle = C.wood;     g.fillRect(dx + 1, dy, dw - 2, TS);
    for (let x = dx + 3; x < dx + dw - 2; x += 5) {
      g.fillStyle = C.woodDark; g.fillRect(x, dy, 0.5, TS);
    }
    g.fillStyle = '#3d3934';
    g.fillRect(dx + 1, dy + 3, dw - 2, 1.5); g.fillRect(dx + 1, dy + 9, dw - 2, 1.5);
  })();

  /* a worn shadow line where wall meets floor, all round */
  const vg = g.createLinearGradient(0, wallH - 4, 0, wallH + 10);
  vg.addColorStop(0, 'rgba(20,16,10,0.35)'); vg.addColorStop(1, 'rgba(20,16,10,0)');
  g.fillStyle = vg; g.fillRect(0, wallH - 4, W, 14);
})();

/* ── firelight: the only thing that animates in the room ── */
function drawFlame(g, x, y, seed, scale) {
  const s = scale || 1;
  const f = (tick + seed * 13) * 0.18;
  const w = (1.5 + Math.sin(f) * 0.35) * s;
  const h = (3 + Math.cos(f * 1.3) * 0.6) * s;
  g.fillStyle = C.flame3; ellipse(g, x, y - h*0.3, w, h, C.flame3);
  g.fillStyle = C.flame1; ellipse(g, x, y - h*0.4, w*0.62, h*0.72, C.flame1);
  g.fillStyle = C.flame2; ellipse(g, x, y - h*0.5, w*0.3, h*0.4, C.flame2);
}
function drawGlow(g, x, y, r, a) {
  const rg = g.createRadialGradient(x, y, 0, x, y, r);
  rg.addColorStop(0, `rgba(255,196,110,${a})`);
  rg.addColorStop(1, 'rgba(255,196,110,0)');
  g.fillStyle = rg; g.fillRect(x - r, y - r, r*2, r*2);
}

/* Candles lit today, 0..12. Lighting the rack fills it; it empties at
   matins with the new day, so the room visibly tracks the player's streak. */
let candlesLit = 0;

function drawAltarCandles(g) {
  const ax = 6*TS, aw = 3*TS, ay = WALL_H - 4;
  for (const cx of [ax + 6, ax + aw - 6]) {
    g.fillStyle = C.gold;      g.fillRect(cx - 1, ay - 2, 2, 4);        // stick
    g.fillStyle = C.cloth;     g.fillRect(cx - 1, ay - 8, 2, 6);        // candle
    g.fillStyle = C.clothSh;   g.fillRect(cx + 0.5, ay - 8, 0.5, 6);
    drawGlow(g, cx, ay - 10, 14, 0.16);
    drawFlame(g, cx, ay - 9, cx, 1);
  }
}
function drawRackCandles(g) {
  const s = STATIONS.candles;
  const x = s.c0*TS, y = s.r0*TS + 4;
  for (let i = 0; i < 12; i++) {
    const tier = (i / 4) | 0, k = i % 4;
    const cx = x + 5.5 + k*8, ty = y + 6 + tier*14;
    if (i < candlesLit) {
      g.fillStyle = C.cloth;   g.fillRect(cx - 1, ty - 7, 2, 5);
      g.fillStyle = C.clothSh; g.fillRect(cx + 0.5, ty - 7, 0.5, 5);
      drawGlow(g, cx, ty - 8, 11, 0.14);
      drawFlame(g, cx, ty - 8, i * 7, 0.8);
    } else {
      g.fillStyle = C.stoneDark; g.fillRect(cx - 0.5, ty - 2, 1, 2);    // a stub
    }
  }
}

/* ============================ entities ============================ */
const player = { x: 7.5*TS, y: 11*TS, dir: 'up', frame: 0, animT: 0, pose: 'stand' };
const abbot  = { x: 5.2*TS, y: 5.4*TS, dir: 'right', frame: 0, animT: 0, bob: 0 };
const ABBOT_Y = 5.4 * TS;

function drawEntity(g, ent, sprite) {
  const set = ent.pose === 'kneel' ? sprite.kneel : sprite[ent.dir][ent.frame | 0];
  const lw = set.lw, lh = set.lh;
  /* contact shadow, so nobody floats */
  ellipse(g, ent.x, ent.y + 2, 6, 2.5, C.shadow);
  /* `+ 4` puts the sprite's feet two pixels below the anchor, whatever the
     frame's height — which is why the taller canvas did not move anyone. */
  g.drawImage(set, 0, 0, set.width, set.height,
              Math.round((ent.x - lw/2) * 2) / 2, Math.round((ent.y - lh + 4) * 2) / 2, lw, lh);
}

/* ============================ input ============================ */
const input = { up:false, down:false, left:false, right:false };
const tapQ = { up:false, down:false, left:false, right:false };
let aQueued = false, bQueued = false;
const typing = () => document.activeElement && document.activeElement.tagName === 'INPUT';

addEventListener('keydown', e => {
  if (typing()) { if (e.key === 'Escape') e.target.blur(); return; }
  const k = e.key;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Tab'].includes(k)) e.preventDefault();
  if (k === 'ArrowUp'    || k === 'w' || k === 'W') { input.up = true;    if (!e.repeat) tapQ.up = true; }
  if (k === 'ArrowDown'  || k === 's' || k === 'S') { input.down = true;  if (!e.repeat) tapQ.down = true; }
  if (k === 'ArrowLeft'  || k === 'a' || k === 'A') { input.left = true;  if (!e.repeat) tapQ.left = true; }
  if (k === 'ArrowRight' || k === 'd' || k === 'D') { input.right = true; if (!e.repeat) tapQ.right = true; }
  if (e.repeat) return;
  if (k === 'Enter' || k === ' ' || k === 'e' || k === 'E' || k === 'z') aQueued = true;
  if (k === 'Escape' || k === 'x' || k === 'X' || k === 'Backspace') bQueued = true;
  if (k === 'Tab') toggleBook();
  if (k === 'm' || k === 'M') toggleMute();
});
addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowUp'    || k === 'w' || k === 'W') input.up = false;
  if (k === 'ArrowDown'  || k === 's' || k === 'S') input.down = false;
  if (k === 'ArrowLeft'  || k === 'a' || k === 'A') input.left = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') input.right = false;
});

const dpadEl = document.getElementById('dpad');
function dpadFrom(e) {
  const r = dpadEl.getBoundingClientRect();
  const nx = (e.clientX - r.left) / r.width - 0.5;
  const ny = (e.clientY - r.top) / r.height - 0.5;
  input.up = input.down = input.left = input.right = false;
  if (Math.abs(nx) < 0.08 && Math.abs(ny) < 0.08) return;
  if (Math.abs(nx) > Math.abs(ny)) { if (nx < 0) input.left = true; else input.right = true; }
  else { if (ny < 0) input.up = true; else input.down = true; }
  /* latch it, so a quick thumb-tap still turns a page in THE BOOK */
  for (const k of ['up','down','left','right']) if (input[k]) tapQ[k] = true;
}
dpadEl.addEventListener('pointerdown', e => {
  dpadEl.setPointerCapture(e.pointerId); dpadEl.classList.add('pressed'); dpadFrom(e);
});
dpadEl.addEventListener('pointermove', e => { if (dpadEl.classList.contains('pressed')) dpadFrom(e); });
['pointerup','pointercancel'].forEach(ev => dpadEl.addEventListener(ev, () => {
  dpadEl.classList.remove('pressed');
  input.up = input.down = input.left = input.right = false;
}));
function bindButton(id, fn) {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); el.classList.add('pressed'); fn(); });
  ['pointerup','pointercancel','pointerleave'].forEach(ev =>
    el.addEventListener(ev, () => el.classList.remove('pressed')));
}

bindButton('btn-b', () => { bQueued = true; });

/* ============================ sound ============================
   Every effect is synthesised — a plainchant-ish bell, a match strike, a
   page turn. No audio files, so nothing to host and nothing to download. */
const sound = (() => {
  let actx = null, muted = localStorage.getItem('monk_muted') === '1';
  const ac = () => (actx = actx || new (window.AudioContext || window.webkitAudioContext)());
  function tone(freq, dur, type, gain, delay, slideTo) {
    if (muted) return;
    try {
      const a = ac(), t0 = a.currentTime + (delay || 0);
      const o = a.createOscillator(), g = a.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t0);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(gain || 0.15, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(a.destination);
      o.start(t0); o.stop(t0 + dur + 0.05);
    } catch (e) { /* audio is a nicety, never a failure */ }
  }
  function noise(dur, gain) {
    if (muted) return;
    try {
      const a = ac(), n = a.sampleRate * dur;
      const buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random()*2 - 1) * (1 - i/n);
      const src = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter();
      f.type = 'bandpass'; f.frequency.value = 2400;
      g.gain.value = gain || 0.08;
      src.buffer = buf; src.connect(f); f.connect(g); g.connect(a.destination); src.start();
    } catch (e) {}
  }
  return {
    unlock() { try { ac().resume(); } catch (e) {} },
    get muted() { return muted; },
    toggle() { muted = !muted; localStorage.setItem('monk_muted', muted ? '1' : '0'); return muted; },
    step()    { noise(0.05, 0.02); },
    blip()    { tone(660, 0.08, 'square', 0.07); },
    page()    { noise(0.12, 0.05); },
    match()   { noise(0.18, 0.10); tone(320, 0.25, 'triangle', 0.05, 0.05, 620); },
    /* a low bell with its overtone — the abbey's own voice */
    bell()    { tone(196, 1.8, 'sine', 0.16); tone(392, 1.4, 'sine', 0.05); tone(587, 0.9, 'sine', 0.02); },
    chant()   { [262, 294, 330, 294].forEach((f, i) => tone(f, 0.55, 'sine', 0.07, i * 0.34)); },
    reward()  { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.3, 'triangle', 0.09, i * 0.09)); },
    levelUp() { [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, 0.5, 'sine', 0.1, i * 0.11)); },
    deny()    { tone(180, 0.22, 'square', 0.07, 0, 120); },
  };
})();
const muteBtn = document.getElementById('btn-mute');
function toggleMute() {
  muteBtn.classList.toggle('muted', sound.toggle());
}
bindButton('btn-mute', toggleMute);

const dlg = { open: false, name: '', pages: [], page: 0, chars: 0, after: null };
const DLG_SPEED = 0.5;

function say(name, pages, after) {
  dlg.open = true; dlg.name = name;
  dlg.pages = Array.isArray(pages) ? pages : [pages];
  dlg.page = 0; dlg.chars = 0; dlg.after = after || null;
}
function dialogAdvance() {
  const full = dlg.pages[dlg.page];
  if (dlg.chars < full.length) { dlg.chars = full.length; return; }   // skip the typewriter
  if (dlg.page < dlg.pages.length - 1) { dlg.page++; dlg.chars = 0; sound.page(); return; }
  dlg.open = false;
  const fn = dlg.after; dlg.after = null;
  if (fn) fn();
}
function wrapText(text, maxW) {
  ctx.font = FONT;
  const words = String(text).split(' ');
  const lines = []; let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; }
    else line = t;
  }
  if (line) lines.push(line);
  return lines;
}
function drawDialog(g) {
  const bx = 6, by = ROOM_H - 70, bw = W - 12, bh = 66;
  g.fillStyle = 'rgba(20,16,12,0.96)'; g.fillRect(bx, by, bw, bh);
  g.strokeStyle = C.goldDark; g.lineWidth = 2; g.strokeRect(bx + 1, by + 1, bw - 2, bh - 2);
  g.strokeStyle = 'rgba(120,98,58,0.7)'; g.lineWidth = 1; g.strokeRect(bx + 3.5, by + 3.5, bw - 7, bh - 7);
  g.fillStyle = C.goldHi;
  g.fillRect(bx + 1, by + 1, 2, 2); g.fillRect(bx + bw - 3, by + 1, 2, 2);
  g.fillRect(bx + 1, by + bh - 3, 2, 2); g.fillRect(bx + bw - 3, by + bh - 3, 2, 2);
  g.font = FONT; g.textBaseline = 'top'; g.textAlign = 'left';
  g.fillStyle = C.gold; g.fillText(dlg.name, bx + 8, by + 8);
  const full = dlg.pages[dlg.page];
  const lines = wrapText(full.slice(0, Math.floor(dlg.chars)), bw - 18);
  g.fillStyle = C.white;
  for (let i = 0; i < Math.min(lines.length, 3); i++) g.fillText(lines[i], bx + 8, by + 24 + i * 12);
  if (dlg.chars >= full.length && Math.floor(tick / 20) % 2) {
    g.fillStyle = C.gold; g.fillText('▼', bx + bw - 14, by + bh - 13);
  }
}

/* ============================ the HUD ============================
   Total devotion, the level bar, the streak and the day. It is the only
   thing on screen that is always true, so it gets the top strip. */
/**
 * The HUD is a permanent strip along the bottom 30px, below the room. It
 * is not an overlay — the room is drawn 208px tall precisely so this can
 * sit under it without covering the altar, the rose window or the player.
 *
 *   row 1: devotion · the three offices · streak/day
 *   row 2: the level bar, with rank and the gap to the next level
 */
function drawHUD(g) {
  const p = state.player;
  const bx = 0, by = HUD_Y, bw = W, bh = H - HUD_Y;

  const grad = g.createLinearGradient(0, by, 0, by + bh);
  grad.addColorStop(0, 'rgba(34,28,20,0.97)');
  grad.addColorStop(1, 'rgba(14,12,9,0.97)');
  g.fillStyle = grad; g.fillRect(bx, by, bw, bh);
  g.fillStyle = C.goldDark; g.fillRect(bx, by, bw, 1);
  g.fillStyle = C.goldHi;   g.fillRect(bx, by + 1, bw, 0.5);

  g.font = FONT; g.textBaseline = 'middle'; g.textAlign = 'left';

  /* the flame sigil — devotion, in one mark */
  drawGlow(g, 9, by + 9, 9, 0.26);
  drawFlame(g, 9, by + 12, 3, 1.15);
  g.fillStyle = C.goldHi;
  g.fillText(String(p.devotion), 16, by + 8);

  /* the three offices, as lamps: lit when kept */
  const done = p.tasksToday;
  let ox = 96;
  g.font = '6px "Press Start 2P", monospace';
  g.fillStyle = C.dim; g.textAlign = 'right';
  g.fillText('OFFICES', ox - 4, by + 8);
  g.textAlign = 'left';
  for (const k of ['confess', 'pray', 'candles']) {
    const has = done.includes(k);
    if (has) drawGlow(g, ox + 2, by + 8, 6, 0.3);
    ellipse(g, ox + 2, by + 8, 2, 2, has ? C.flame2 : 'rgba(120,112,96,0.5)');
    ox += 9;
  }

  /* streak, or the day count before a streak exists */
  g.font = FONT; g.textAlign = 'right';
  if (p.streak > 0) {
    g.fillStyle = p.multiplier > 1 ? C.flame2 : C.dim;
    g.fillText(`${p.streak}d x${p.multiplier}`, W - 4, by + 8);
  } else {
    g.fillStyle = C.dim;
    g.fillText(state.clock.ended ? 'CLOSED' : `DAY ${Math.max(0, state.clock.day) + 1}/56`, W - 4, by + 8);
  }

  /* ── the level bar ── */
  const lx = 4, ly = by + 16, lw = W - 8, lh = 5;
  g.fillStyle = '#241d14'; g.fillRect(lx, ly, lw, lh);
  g.strokeStyle = C.goldDark; g.lineWidth = 0.5; g.strokeRect(lx + 0.25, ly + 0.25, lw - 0.5, lh - 0.5);
  const frac = Math.max(0, Math.min(1, p.intoLevel / Math.max(1, p.levelSpan)));
  /* the fill is lit like a candle: warm core, brighter crown */
  const fw = Math.floor((lw - 2) * frac);
  if (fw > 0) {
    const fg = g.createLinearGradient(0, ly, 0, ly + lh);
    fg.addColorStop(0, C.flame2); fg.addColorStop(0.5, C.flame1); fg.addColorStop(1, C.flame3);
    g.fillStyle = fg; g.fillRect(lx + 1, ly + 1, fw, lh - 2);
    g.fillStyle = 'rgba(255,255,220,0.55)'; g.fillRect(lx + 1, ly + 1, fw, 0.5);
  }
  /* rank under the bar on the left, the gap to the next level on the right */
  g.font = '6px "Press Start 2P", monospace';
  g.textBaseline = 'top';
  g.textAlign = 'left';  g.fillStyle = C.gold;
  g.fillText(`L${p.level} ${p.rank.toUpperCase()}`, lx, ly + lh + 2);
  g.textAlign = 'right'; g.fillStyle = C.dim;
  g.fillText(`${p.toNextLevel} TO L${p.level + 1}`, lx + lw, ly + lh + 2);
  g.font = FONT; g.textAlign = 'left';
}

/* ============================ state ============================
   One object, filled from /state. The game never computes devotion or
   levels itself — the Worker is the only authority, so a tampered client
   can lie to its own screen and nowhere else. */
const BLANK = {
  devotion: 0, level: 1, rank: 'Postulant', intoLevel: 0, levelSpan: 30,
  toNextLevel: 30, streak: 0, multiplier: 1, tasksToday: [], monks: 0,
  monkDevotion: [], xHandle: null, refBonus: 0,
};
const state = {
  clock: { day: 0, totalDays: 56, started: true, ended: false },
  player: Object.assign({}, BLANK),
  wallet: null, token: null, signedIn: false,
  online: false, note: '',
};

/* ── the network layer ──
   Everything is one of four calls. Failures are never fatal: the abbey
   stays walkable offline, it just cannot record anything. */
const api = {
  async call(path, { method = 'GET', body, auth } = {}) {
    const res = await fetch(CFG.api + path, {
      method,
      headers: {
        ...(body ? { 'Content-Type': 'application/json' } : {}),
        ...(auth && state.token ? { Authorization: `Bearer ${state.token}` } : {}),
      },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(data.error || `error ${res.status}`), { status: res.status });
    return data;
  },
  state(wallet) { return this.call(`/state${wallet ? `?wallet=${wallet}` : ''}`); },
  task(task)    { return this.call('/task', { method: 'POST', body: { task }, auth: true }); },
  linkX(handle) { return this.call('/x/link', { method: 'POST', body: { handle }, auth: true }); },
  board(by)     { return this.call(`/leaderboard?by=${by}&limit=25`); },
};

async function refresh() {
  try {
    const s = await api.state(state.wallet);
    state.clock = s.clock;
    state.online = true;
    if (s.player) {
      const before = state.player.level;
      Object.assign(state.player, s.player);
      /* the rack mirrors the day's offices: four candles per office kept */
      candlesLit = Math.min(12, state.player.tasksToday.length * 4);
      if (s.player.level > before && before > 0) sound.levelUp();
    }
  } catch (e) {
    state.online = false;
    state.note = 'the abbey is unreachable';
  }
}

/* ── wallet + sign-in ── */
let provider = null, signer = null;

async function connect() {
  if (!window.ethereum) throw new Error('no wallet found in this browser');
  provider = new ethers.providers.Web3Provider(window.ethereum, 'any');
  await provider.send('eth_requestAccounts', []);
  /* the abbey keeps its books on one chain; ask to switch, offer to add */
  try {
    await window.ethereum.request({
      method: 'wallet_switchEthereumChain', params: [{ chainId: CFG.chainId }],
    });
  } catch (e) {
    if (e.code === 4902) {
      await window.ethereum.request({
        method: 'wallet_addEthereumChain',
        params: [{
          chainId: CFG.chainId, chainName: CFG.chainName,
          nativeCurrency: { name: 'Ether', symbol: 'ETH', decimals: 18 },
          rpcUrls: [CFG.rpc], blockExplorerUrls: [CFG.explorer],
        }],
      });
    }
  }
  signer = provider.getSigner();
  state.wallet = (await signer.getAddress()).toLowerCase();
  localStorage.setItem('monk_wallet', state.wallet);
  await refresh();
  return state.wallet;
}

/** Sign in: one signature over a message the Worker minted. It grants a
 *  session and nothing else — no allowance, no transaction. */
async function signIn() {
  if (!signer) await connect();
  const { message, issuedAt } = await api.call('/auth/nonce', {
    method: 'POST', body: { wallet: state.wallet },
  });
  const signature = await signer.signMessage(message);
  const out = await api.call('/auth/verify', {
    method: 'POST', body: { wallet: state.wallet, issuedAt, signature },
  });
  state.token = out.token;
  state.signedIn = true;
  localStorage.setItem('monk_token', out.token);
  await refresh();
}

/* restore a session from a previous visit */
(function restore() {
  const w = localStorage.getItem('monk_wallet'), t = localStorage.getItem('monk_token');
  if (w && t) {
    state.wallet = w; state.token = t;
    /* trust it provisionally; the first 401 clears it */
    state.signedIn = true;
  }
  refresh();
})();

const MINT_ABI = [
  'function mint(uint256 quantity) payable',
  'function mintWithReferrer(uint256 quantity, address referrer) payable',
  'function balanceOf(address) view returns (uint256)',
  'function totalMinted() view returns (uint256)',
];

async function mint(qty, referrer) {
  if (!signer) await connect();
  const c = new ethers.Contract(CFG.contract, MINT_ABI, signer);
  const value = ethers.utils.parseEther(CFG.mintPrice).mul(qty);
  const tx = referrer && ethers.utils.isAddress(referrer)
    ? await c.mintWithReferrer(qty, referrer, { value })
    : await c.mint(qty, { value });
  return tx;
}

/* ============================ the offices ============================
   Walking to a station and pressing A keeps that office. The ceremony is
   short on purpose — the reward is the number going up, not a cutscene. */

let ceremony = null;   // { task, t, phase }

function nearStation() {
  for (const [id, s] of Object.entries(STATIONS)) {
    const dx = player.x - s.stand.x, dy = player.y - s.stand.y;
    if (Math.abs(dx) < 14 && Math.abs(dy) < 16) return id;
  }
  return null;
}

const OFFICE_LINES = {
  confess: ['You kneel at the screen and say the thing you have been carrying.',
            'The silence on the other side is not empty. It is listening.'],
  pray:    ['You kneel at the altar. The rose window throws its colours across your hands.',
            'You do not ask for anything. That is rather the point.'],
  candles: ['You take a taper from the stub of the last one and touch it to the wicks.',
            'Twelve small lights against a very large dark.'],
};

const DENY_LINES = {
  offline:  'The abbey ledger cannot be reached. Try again in a moment.',
  signedOut:'You are not yet of this house. Open THE BOOK and take your vows.',
  noMonk:   'You hold no habit. Mint a Monk in THE BOOK and return.',
  done:     'You have already kept this office today. Come back at matins.',
  notOpen:  'The abbey has not yet opened its doors.',
  closed:   'The fifty-six days are ended. The book is closed.',
};

async function keepOffice(id) {
  const s = STATIONS[id];
  if (!state.online)              return say(s.name, DENY_LINES.offline, null), sound.deny();
  if (state.clock.ended)          return say(s.name, DENY_LINES.closed, null), sound.deny();
  if (!state.clock.started)       return say(s.name, DENY_LINES.notOpen, null), sound.deny();
  if (!state.signedIn)            return say(s.name, DENY_LINES.signedOut, null), sound.deny();
  if (state.player.tasksToday.includes(id)) return say(s.name, DENY_LINES.done, null), sound.deny();
  if (!state.player.monks)        return say(s.name, DENY_LINES.noMonk, null), sound.deny();

  /* face the station and settle into the office */
  player.dir = s.face;
  player.pose = id === 'candles' ? 'stand' : 'kneel';
  ceremony = { task: id, t: 0 };
  if (id === 'pray') sound.chant();
  if (id === 'confess') sound.bell();

  say(s.name, OFFICE_LINES[id], async () => {
    try {
      const out = await api.task(id);
      Object.assign(state.player, {
        devotion: out.devotion, level: out.level, rank: out.rank,
        intoLevel: out.intoLevel, levelSpan: out.levelSpan,
        toNextLevel: out.toNextLevel, streak: out.streak,
        multiplier: out.multiplier, tasksToday: out.tasksToday,
      });
      candlesLit = Math.min(12, out.tasksToday.length * 4);
      if (id === 'candles') sound.match();
      sound.reward();
      popup(`+${out.gained}`, player.x, player.y - 30, C.goldHi);
      if (out.multiplier > 1) popup(`x${out.multiplier} STREAK`, player.x, player.y - 40, C.flame2);

      if (out.dayComplete) {
        sound.bell();
        setTimeout(() => say('THE ABBOT', [
          `All three offices kept. That is ${out.streak} ${out.streak === 1 ? 'day' : 'days'} unbroken.`,
          nextTierLine(out.streak),
        ]), 700);
      }
    } catch (e) {
      if (e.status === 401) { state.signedIn = false; localStorage.removeItem('monk_token'); }
      sound.deny();
      say(s.name, e.message || 'the ledger refused the entry');
    } finally {
      ceremony = null;
      player.pose = 'stand';
    }
  });
}

function nextTierLine(streak) {
  const tiers = [[7, 1.5], [14, 2], [21, 2.5], [28, 3]];
  for (const [d, m] of tiers) {
    if (streak < d) return `Keep them ${d - streak} more ${d - streak === 1 ? 'day' : 'days'} and every devotion is worth ${m}x.`;
  }
  return 'You hold the full threefold measure. Do not break it now.';
}

        html += `<div class="tasklist">
          <div><span class="dim">RANK</span><span>L${p.level} ${esc(p.rank)}</span></div>
          <div><span class="dim">DEVOTION</span><span>${p.devotion}</span></div>
          <div><span class="dim">STREAK</span><span>${p.streak}d · x${p.multiplier}</span></div>
          <div><span class="dim">MONKS HELD</span><span>${p.monks} / ${CFG.maxPerWallet}</span></div>
          <div><span class="dim">FROM REFERRALS</span><span>${p.refBonus}</span></div>
        </div>
        <p class="dim">Day ${Math.max(0, state.clock.day) + 1} of ${state.clock.totalDays}.</p>`;
      }
    }
    if (!state.online) html += `<p class="bad">The abbey ledger is unreachable.</p>`;

  } else if (bookTab === 1) {    /* ── HABIT: mint ── */
    html += `<p class="lead">A Monk is ${CFG.mintPrice} ETH. Up to ${CFG.maxPerWallet} per wallet.</p>
             <p class="dim">Every Monk in your wallet earns everything you earn — you do not play them separately. Buy one on a secondary market and it starts earning the moment it lands.</p>`;
    if (!state.wallet) {
      html += `<button id="act-connect" class="primary">CONNECT WALLET</button>`;
    } else {
      const left = Math.max(0, CFG.maxPerWallet - p.monks);
      html += `<label>HOW MANY (${left} left)<input id="mint-qty" type="number" min="1" max="${left || 1}" value="1" inputmode="numeric"></label>
               <button id="act-mint" class="primary" ${left ? '' : 'disabled'}>MINT</button>
               <p class="dim" id="mint-status"></p>`;
    }
    const ref = new URLSearchParams(location.search).get('ref');
    if (ref) html += `<p class="good">Minting under a referral from ${esc(shortAddr(ref))}.</p>`;
    html += `<hr style="border:0;border-top:0.25cqw solid #4a3f28">
             <p class="dim">Your own referral link pays you 20 devotion for every Monk minted through it.</p>
             <div class="row"><input id="ref-link" readonly value="${esc(referralLink())}"><button id="act-copy">COPY</button></div>`;

  } else if (bookTab === 2) {    /* ── LEDGER: the offices and the streak ladder ── */
    const done = p.tasksToday;
    html += `<p class="lead">Three offices a day, 10 devotion each.</p>
      <div class="tasklist">
        ${['confess','pray','candles'].map(k => `<div>
          <span>${k === 'confess' ? 'CONFESS' : k === 'pray' ? 'PRAY' : 'LIGHT CANDLES'}</span>
          <span class="${done.includes(k) ? 'good' : 'dim'}">${done.includes(k) ? 'KEPT' : '—'}</span>
        </div>`).join('')}
      </div>
      <p class="dim">Keep all three in a day and the day counts toward your streak.</p>
      <div class="tasklist">
        ${[[7,'1.5x'],[14,'2x'],[21,'2.5x'],[28,'3x']].map(([d, m]) => `<div>
          <span class="${p.streak >= d ? 'good' : 'dim'}">${d} DAYS</span>
          <span class="${p.streak >= d ? 'good' : 'dim'}">${m}</span>
        </div>`).join('')}
      </div>`;
    if (p.monkDevotion && p.monkDevotion.length) {
      html += `<p class="dim">Your monks</p><div class="board">` +
        p.monkDevotion.map(m => `<div class="board-row"><b>#${m.tokenId}</b><span>${m.devotion}</span></div>`).join('') +
        `</div>`;
    }

  } else if (bookTab === 3) {    /* ── THE CROWD: X engagement ── */
    html += `<p class="lead">Engage with @${esc(CFG.x)} and the abbey pays.</p>
      <div class="tasklist">
        <div><span>LIKE</span><span class="good">2</span></div>
        <div><span>COMMENT</span><span class="good">3</span></div>
        <div><span>REPOST</span><span class="good">5</span></div>
      </div>
      <p class="dim">Your streak multiplier applies to these too.</p>`;
    if (!state.signedIn) {
      html += `<p class="dim">Take your vows first, on the VOWS page.</p>`;
    } else if (p.xHandle) {
      html += `<p class="good">Linked as @${esc(p.xHandle)}.</p>`;
    } else {
      html += `<label>YOUR X HANDLE<input id="x-handle" placeholder="without the @" maxlength="15" autocomplete="off" spellcheck="false" value="${esc(p.xPending || '')}"></label>
               <button id="act-linkx" class="primary">LINK</button>
               <p class="dim" id="x-status"></p>`;
    }

  } else {                       /* ── THE ROLL: leaderboards ── */
    html += `<div class="row"><button id="board-wallet">BROTHERS</button><button id="board-monk">MONKS</button></div>`;
    if (!boardCache) {
      html += `<p class="dim">Loading the roll…</p>`;
    } else if (!boardCache.entries.length) {
      html += `<p class="dim">No devotion recorded yet. Be the first.</p>`;
    } else {
      html += `<div class="board">` + boardCache.entries.map(e => {
        const mine = e.wallet && state.wallet && e.wallet.toLowerCase() === state.wallet;
        const who = boardCache.by === 'monk' ? `#${e.tokenId}` : shortAddr(e.wallet);
        return `<div class="board-row${mine ? ' me' : ''}"><b>${e.rank}</b><span>${esc(who)}</span><span>${e.devotion}</span></div>`;
      }).join('') + `</div>`;
    }
  }

  bookBody.innerHTML = html;
  wireBook();
}

function wireBook() {
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  const status = (id, msg, cls) => {
    const el = document.getElementById(id);
    if (el) { el.textContent = msg; el.className = cls || 'dim'; }
  };

  on('act-connect', async () => {
    try { await connect(); renderBook(); }
    catch (e) { alert(e.message); }
  });
  on('act-signin', async () => {
    try { await signIn(); renderBook(); }
    catch (e) { alert(e.message || 'signature refused'); }
  });
  on('act-mint', async () => {
    const qty = Math.max(1, Math.min(CFG.maxPerWallet, parseInt(
      (document.getElementById('mint-qty') || {}).value || '1', 10)));
    const ref = new URLSearchParams(location.search).get('ref');
    status('mint-status', 'confirm in your wallet…');
    try {
      const tx = await mint(qty, ref);
      status('mint-status', 'minting…', 'dim');
      await tx.wait();
      status('mint-status', `minted ${qty}. the abbey sees new monks within five minutes.`, 'good');
      setTimeout(refresh, 4000);
    } catch (e) {
      status('mint-status', e.reason || e.message || 'mint failed', 'bad');
    }
  });
  on('act-copy', async () => {
    const el = document.getElementById('ref-link');
    try { await navigator.clipboard.writeText(el.value); }
    catch (e) { el.select(); }
    const b = document.getElementById('act-copy');
    if (b) { b.textContent = 'COPIED'; setTimeout(() => { b.textContent = 'COPY'; }, 1400); }
  });
  on('act-linkx', async () => {
    const handle = (document.getElementById('x-handle') || {}).value || '';
    try {
      const out = await api.linkX(handle);
      status('x-status', `Reply to any @${CFG.x} post with ${out.code} to confirm.`, 'good');
    } catch (e) {
      status('x-status', e.message || 'could not link that handle', 'bad');
    }
  });
  const loadBoard = async (by) => {
    boardCache = null; renderBook();
    try { boardCache = await api.board(by); } catch (e) { boardCache = { by, entries: [] }; }
    renderBook();
  };
  on('board-wallet', () => loadBoard('wallet'));
  on('board-monk',  () => loadBoard('monk'));
  if (bookTab === 4 && !boardCache) loadBoard('wallet');
}

/* the d-pad drives the book: left/right change tabs, B closes */
function bookNav() {
  if (tapLeft)  { bookTab = (bookTab + TABS.length - 1) % TABS.length; boardCache = null; sound.page(); renderBook(); }
  if (tapRight) { bookTab = (bookTab + 1) % TABS.length;               boardCache = null; sound.page(); renderBook(); }
  if (bQueued)  { bQueued = false; toggleBook(false); }
  aQueued = false;
}

/* ============================ loop ============================ */
let tick = 0;
let tapUp = false, tapDown = false, tapLeft = false, tapRight = false;
let prevIn = { up:false, down:false, left:false, right:false };
/* A press shorter than one frame would otherwise vanish between samples —
   `tapQ` latches it on keydown so menu navigation never drops a tap. */
function readTaps() {
  tapUp    = (input.up    && !prevIn.up)    || tapQ.up;
  tapDown  = (input.down  && !prevIn.down)  || tapQ.down;
  tapLeft  = (input.left  && !prevIn.left)  || tapQ.left;
  tapRight = (input.right && !prevIn.right) || tapQ.right;
  tapQ.up = tapQ.down = tapQ.left = tapQ.right = false;
  prevIn = { ...input };
}

const SPEED = 0.9;
let stepSfx = 0;

function update() {
  tick++;
  readTaps();

  for (let i = popups.length - 1; i >= 0; i--) {
    if (++popups[i].life > 90) popups.splice(i, 1);
  }
  abbot.bob += 0.03;

  if (!booted) { aQueued = bQueued = false; return; }
  if (bookOpen) { bookNav(); return; }
  if (dlg.open) {
    const full = dlg.pages[dlg.page];
    if (dlg.chars < full.length) dlg.chars += DLG_SPEED * 4;
    if (aQueued || bQueued) { aQueued = bQueued = false; dialogAdvance(); }
    return;
  }
  if (ceremony) { ceremony.t++; aQueued = bQueued = false; return; }

  /* ── walking ── */
  let dx = 0, dy = 0;
  if (input.left) dx -= 1;
  if (input.right) dx += 1;
  if (input.up) dy -= 1;
  if (input.down) dy += 1;
  if (dx && dy) { dx *= 0.7071; dy *= 0.7071; }

  const moving = !!(dx || dy);
  if (moving) {
    if (dy < 0 && !dx) player.dir = 'up';
    else if (dy > 0 && !dx) player.dir = 'down';
    else if (dx < 0) player.dir = 'left';
    else if (dx > 0) player.dir = 'right';

    const nx = player.x + dx * SPEED;
    if (!blocked(nx, player.y)) player.x = nx;
    const ny = player.y + dy * SPEED;
    if (!blocked(player.x, ny)) player.y = ny;

    player.animT += 0.16;
    player.frame = (player.animT | 0) % 2;
    if (++stepSfx % 26 === 0) sound.step();
  } else {
    player.frame = 0; player.animT = 0;
  }

  /* ── A on a station keeps that office; A on the abbot asks for guidance ── */
  if (aQueued) {
    aQueued = false;
    sound.unlock();
    const near = nearStation();
    const dxA = player.x - abbot.x, dyA = player.y - abbot.y;
    if (near) keepOffice(near);
    else if (Math.abs(dxA) < 20 && Math.abs(dyA) < 20) abbotSpeaks();
    else sound.blip();
  }
  if (bQueued) { bQueued = false; toggleBook(true); }
}

function abbotSpeaks() {
  const p = state.player;
  if (!state.signedIn) {
    return say('THE ABBOT', [
      'You have the look of a man who has walked a long way to stand in a cold room.',
      'Take your vows in THE BOOK, brother. Then the offices will count for something.',
    ]);
  }
  if (!p.monks) {
    return say('THE ABBOT', [
      'You cannot keep the hours without a habit.',
      `A Monk is ${CFG.mintPrice} ETH, and no man here holds more than ${CFG.maxPerWallet}.`,
    ]);
  }
  const left = 3 - p.tasksToday.length;
  say('THE ABBOT', left > 0
    ? [`${left} ${left === 1 ? 'office remains' : 'offices remain'} today.`,
       p.streak > 0 ? `Your streak stands at ${p.streak} ${p.streak === 1 ? 'day' : 'days'}. ${nextTierLine(p.streak)}` : 'Keep all three and the streak begins.']
    : ['All three kept. Rest, brother.',
       `You are ${p.toNextLevel} devotion from ${RANK_NEXT(p.level)}.`]);
}
const RANKS_LIST = ['Postulant','Novice','Oblate','Acolyte','Lay Brother','Brother','Cantor',
  'Sacristan','Almoner','Cellarer','Infirmarian','Scribe','Precentor','Sub-Prior','Prior','Abbot'];
const RANK_NEXT = l => RANKS_LIST[Math.min(RANKS_LIST.length - 1, Math.max(0, l))];

function render() {
  ctx.fillStyle = '#0b0a08'; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(bg, 0, 0, bg.width, bg.height, 0, 0, W, ROOM_H);

  drawAltarCandles(ctx);
  drawRackCandles(ctx);

  /* the abbot drifts a little, so the room is not dead */
  abbot.y = ABBOT_Y + Math.sin(abbot.bob) * 1.2;
  const order = [abbot, player].sort((a, b) => a.y - b.y);
  for (const e of order) drawEntity(ctx, e, e === player ? SPRITES.player : SPRITES.abbot);

  /* a prompt over whichever station you are standing at */
  const near = !dlg.open && !ceremony && nearStation();
  if (near && booted) {
    const s = STATIONS[near];
    const done = state.player.tasksToday.includes(near);
    ctx.font = '6px "Press Start 2P", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const label = done ? 'KEPT TODAY' : `A · ${s.verb}`;
    const w = ctx.measureText(label).width + 8;
    const px = Math.max(w/2 + 2, Math.min(W - w/2 - 2, player.x));
    const py = player.y - 34 + Math.sin(tick * 0.09) * 1.2;
    ctx.fillStyle = 'rgba(20,16,12,0.85)'; ctx.fillRect(px - w/2, py - 5, w, 10);
    ctx.strokeStyle = done ? C.dim : C.goldDark; ctx.lineWidth = 0.5;
    ctx.strokeRect(px - w/2 + 0.25, py - 4.75, w - 0.5, 9.5);
    ctx.fillStyle = done ? C.dim : C.goldHi;
    ctx.fillText(label, px, py);
    ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.font = FONT;
  }

  /* the ceremony: light rises off the player while the office is kept */
  if (ceremony) {
    const t = ceremony.t;
    drawGlow(ctx, player.x, player.y - 12, 26 + Math.sin(t * 0.08) * 3, 0.22);
    for (let i = 0; i < 7; i++) {
      const a = ((t * 0.7 + i * 24) % 60) / 60;
      const px = player.x + Math.sin((t * 0.04) + i * 1.7) * 7;
      const py = player.y - 8 - a * 30;
      ctx.globalAlpha = (1 - a) * 0.85;
      ctx.fillStyle = i % 2 ? C.flame2 : C.goldHi;
      ctx.fillRect(px, py, 1, 1);
      ctx.globalAlpha = 1;
    }
  }

  drawPopups(ctx);

  /* the room is lit by fire, so the corners fall away */
  const vg = ctx.createRadialGradient(W/2, ROOM_H/2, 66, W/2, ROOM_H/2, 152);
  vg.addColorStop(0, 'rgba(255,196,110,0.03)');
  vg.addColorStop(1, 'rgba(10,8,6,0.42)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, ROOM_H);

  if (dlg.open) drawDialog(ctx);
  if (booted) drawHUD(ctx);
}

function loop() { update(); render(); requestAnimationFrame(loop); }

/* ============================ boot ============================
   The console starts dark. Flip the switch, the title card drops in, and
   A steps into the abbey — the same ceremony as Club Nile. */
function drawTitleCard() {
  const c = document.getElementById('boot-cvs');
  const g = c.getContext('2d');
  g.setTransform(2, 0, 0, 2, 0, 0);
  g.imageSmoothingEnabled = false;

  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#141824'); sky.addColorStop(0.55, '#232436'); sky.addColorStop(1, '#0d0c12');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);

  /* a moon and a scatter of stars */
  ellipse(g, 186, 42, 11, 11, '#e8e2c8');
  ellipse(g, 182, 38, 8, 8, '#151828');
  for (let i = 0; i < 40; i++) {
    const x = h2(i, 3) * 2.5 % W, y = h2(7, i) % 110;
    g.fillStyle = i % 3 ? 'rgba(255,250,230,0.55)' : 'rgba(255,250,230,0.85)';
    g.fillRect(x, y, 1, 1);
  }

  /* the abbey on its hill, in silhouette */
  g.fillStyle = '#0f1018';
  g.fillRect(0, 150, W, H - 150);
  ellipse(g, 120, 158, 130, 22, '#0f1018');
  const body = '#191a24';
  g.fillStyle = body;
  g.fillRect(64, 104, 112, 50);                        // nave
  g.fillRect(100, 62, 40, 46);                          // tower
  for (let i = 0; i < 20; i++) g.fillRect(100 + i, 62 - i * 0.9, 40 - i * 2, 2);  // spire
  g.fillStyle = '#0b0c12';
  for (const x of [76, 92, 148, 164]) { g.fillRect(x, 118, 8, 22); ellipse(g, x + 4, 118, 4, 5, '#0b0c12'); }
  /* one lit window — someone is awake */
  g.fillStyle = '#f0c470'; g.fillRect(112, 84, 8, 10); ellipse(g, 116, 84, 4, 5, '#f0c470');
  drawGlow(g, 116, 88, 22, 0.20);

  /* the wordmark */
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '24px "Press Start 2P", monospace';
  g.fillStyle = '#0a0a10';  g.fillText('MONK', W/2 + 2, 190 + 2);
  g.fillStyle = '#e8d9a8';  g.fillText('MONK', W/2, 190);
  g.font = '6px "Press Start 2P", monospace';
  g.fillStyle = '#9c8f70';
  g.fillText('ORDO DEVOTIONIS  ·  MCC', W/2, 210);
  g.textAlign = 'left'; g.textBaseline = 'top';
}

(function initBoot() {
  const bootEl = document.getElementById('boot');
  const bootCard = document.getElementById('boot-card');
  const pressEl = document.getElementById('boot-press');
  const el = document.getElementById('power');
  const knob = document.getElementById('pw-knob');
  const MIN = 3, MAX = 51;
  let on = false, ready = false, drag = null;

  const setKnob = f => { knob.style.left = (MIN + f * (MAX - MIN)) + '%'; };
  setKnob(0);
  drawTitleCard();

  async function bootUp() {
    ready = false;
    pressEl.classList.remove('on');
    bootEl.style.display = 'block';
    bootEl.classList.remove('dark', 'gone');
    bootCard.style.transition = 'none';
    bootCard.classList.remove('in');
    void bootCard.offsetHeight;            // reflow, so the drop replays
    bootCard.style.transition = '';
    bootCard.classList.add('in');
    sound.unlock(); sound.bell();
    await new Promise(r => setTimeout(r, 2400));
    if (!on || booted) return;             // flipped back off mid-drop
    pressEl.classList.add('on');
    ready = true;
  }

  function confirm() {
    if (!on || !ready || booted) return;
    ready = false; booted = true; started = true;
    aQueued = bQueued = false;
    sound.blip();
    pressEl.classList.remove('on');
    bootEl.classList.add('dark');
    document.getElementById('btn-menu').classList.add('live');
    muteBtn.classList.add('live');
    muteBtn.classList.toggle('muted', sound.muted);
    setTimeout(() => { bootEl.classList.add('gone'); sound.chant(); }, 700);
    setTimeout(() => { bootEl.style.display = 'none'; }, 2700);
    refresh();
  }

  function commit() {
    on = !on;
    setKnob(on ? 1 : 0);
    el.classList.toggle('on', on);
    if (on) { if (!booted) bootUp(); }
    else if (booted) location.reload();     // OFF drops the console back to black
  }

  /* the switch commits on a click OR mid-drag, whichever the hand does */
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    sound.unlock();
    drag = { x: e.clientX, moved: false };
  });
  el.addEventListener('pointermove', e => {
    if (!drag) return;
    const r = el.getBoundingClientRect();
    const f = (e.clientX - r.left) / r.width;
    if (!drag.moved && ((!on && f > 0.55) || (on && f < 0.45))) { drag.moved = true; commit(); }
  });
  ['pointerup','pointercancel'].forEach(ev => el.addEventListener(ev, () => {
    if (drag && !drag.moved) commit();
    drag = null;
  }));

  /* A off the title card steps into the abbey */
  document.getElementById('btn-a').addEventListener('pointerdown', confirm);
  addEventListener('keydown', e => {
    if (!booted && (e.key === 'Enter' || e.key === ' ' || e.key === 'e' || e.key === 'E')) confirm();
  });
  cvs.addEventListener('pointerdown', () => { if (!booted) confirm(); });
})();

/* poll the ledger gently — once a minute is plenty for a game whose state
   changes three times a day */
setInterval(() => { if (booted && !bookOpen) refresh(); }, 60000);

if (document.fonts && document.fonts.load) {
  Promise.all([
    document.fonts.load('8px "Press Start 2P"'),
    document.fonts.load('24px "Press Start 2P"'),
  ]).catch(() => {}).then(() => { drawTitleCard(); requestAnimationFrame(loop); });
} else {
  requestAnimationFrame(loop);
}
</script>
