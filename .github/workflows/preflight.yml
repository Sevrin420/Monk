# Check Robinhood Chain before deploying anything.
#
# Answers the questions the code depends on and that cannot be confirmed from
# a dev sandbox: is the chain id what we think, does the public RPC serve
# eth_call (the backend's only chain operation), and does the chain support the
# Cancun opcodes OpenZeppelin 5.x compiles to.
#
# Run it from the Actions tab. It deploys NOTHING and needs no key.
name: preflight

on:
  workflow_dispatch:
    inputs:
      rpc:
        description: 'RPC URL to check'
        default: 'https://rpc.mainnet.chain.robinhood.com'
        required: true
      expected_chain_id:
        description: 'Chain id we expect (decimal)'
        default: '4663'
        required: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: check the chain
        env:
          RPC: ${{ inputs.rpc }}
          EXPECTED: ${{ inputs.expected_chain_id }}
        run: |
          node <<'EOF'
          const RPC = process.env.RPC;
          const EXPECTED = Number(process.env.EXPECTED);
          let failed = false;

          const rpc = async (method, params = []) => {
            const r = await fetch(RPC, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params }),
            });
            if (!r.ok) throw new Error(`${method}: HTTP ${r.status}`);
            const j = await r.json();
            if (j.error) throw new Error(`${method}: ${j.error.message}`);
            return j.result;
          };
          const ok   = (m) => console.log(`ok   ${m}`);
          const bad  = (m) => { failed = true; console.log(`FAIL ${m}`); };

          // ── identity ──
          const id = Number(await rpc('eth_chainId'));
          id === EXPECTED ? ok(`chain id is ${id}`)
                          : bad(`chain id is ${id}, expected ${EXPECTED}`);
          try { console.log(`     client: ${await rpc('web3_clientVersion')}`); } catch {}

          // ── the two calls the Worker actually makes ──
          // There is no log scan any more, so nothing here depends on block
          // time or on getLogs range limits. Just prove eth_call works.
          const head = Number(await rpc('eth_blockNumber'));
          console.log(`     head block: ${head}  (note this for reference only —`
            + ' the backend has no START_BLOCK)');
          try {
            // balanceOf(address) on the zero address: must return a clean word
            const sel = '0x70a08231';
            const out = await rpc('eth_call', [{
              to: '0x0000000000000000000000000000000000000000',
              data: sel + '0'.repeat(64),
            }, 'latest']);
            ok(`eth_call is served (returned ${out === '0x' ? 'empty' : out.length - 2} hex chars)`);
          } catch (e) {
            bad(`eth_call failed: ${e.message} — the backend cannot read holdings`);
          }

          // ── Cancun opcodes: OpenZeppelin 5.x compiles `mcopy`, so a chain
          //    without it would revert at runtime rather than fail to deploy ──
          // PUSH1 20, PUSH1 00, PUSH1 00, MCOPY  -> copy 32 bytes mem[0]->mem[0]
          // PUSH1 20, PUSH1 00, RETURN           -> hand those 32 bytes back
          // On a chain without MCOPY this is an invalid opcode and throws.
          const probe = '0x6020600060005e60206000f3';
          try {
            const out = await rpc('eth_call', [{ data: probe }, 'latest']);
            out && out !== '0x'
              ? ok('MCOPY executes — evmVersion "cancun" is safe')
              : bad('MCOPY returned nothing — do NOT deploy with evmVersion "cancun"');
          } catch (e) {
            bad(`MCOPY probe reverted (${e.message}) — chain predates ArbOS 32; `
              + 'pin an older OpenZeppelin and drop evmVersion to "shanghai"');
          }

          console.log(failed ? '\nPREFLIGHT FAILED' : '\nall preflight checks passed');
          process.exit(failed ? 1 : 0);
          EOF

      - name: what to do next
        if: success()
        run: |
          echo "Set GAME_START and CONTRACT_ADDRESS in worker/wrangler.toml."
          echo "There is no START_BLOCK and no cron to configure."
